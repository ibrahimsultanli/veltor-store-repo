name: Auto Build F-Droid Repo Index

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install F-Droid Server
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Download APKs from Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo
          for tag in $(gh release list --limit 50 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern "*.apk" --dir repo/ --clobber || true
          done

      - name: Generate F-Droid Index & Key
        run: |
          fdroid update -v --create-metadata

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-update F-Droid repo index" || exit 0
          git push
